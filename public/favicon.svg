<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="32" y1="24" x2="480" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E6FE8" />
      <stop offset="52%" stop-color="#0759BC" />
      <stop offset="100%" stop-color="#043D87" />
    </linearGradient>
    <linearGradient id="goldRing" x1="212" y1="196" x2="404" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="48%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="whiteRing" x1="108" y1="196" x2="300" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="diamondTop" x1="204" y1="106" x2="308" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="diamondSide" x1="256" y1="138" x2="314" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
  </defs>

  <!-- Squircle background matching ZEDLABS sibling ecosystem -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)" />
  <rect x="4" y="4" width="504" height="504" rx="112" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" />

  <!-- Right Wedding Ring (Champagne Gold) -->
  <circle cx="308" cy="296" r="94" stroke="url(#goldRing)" stroke-width="34" />

  <!-- Clean weave knockout at top intersection (left ring passes OVER right ring) -->
  <path
    d="M 236.15 207.67 A 94 94 0 0 1 271.62 230.70"
    stroke="url(#bg)"
    stroke-width="48"
    stroke-linecap="round"
  />

  <!-- Left Wedding Ring (Pure Platinum White) -->
  <circle cx="204" cy="296" r="94" stroke="url(#whiteRing)" stroke-width="34" />

  <!-- Clean weave knockout at bottom intersection (right ring passes OVER left ring) -->
  <path
    d="M 275.85 384.33 A 94 94 0 0 1 240.38 361.30"
    stroke="url(#bg)"
    stroke-width="48"
    stroke-linecap="round"
  />

  <!-- Seamless gold foreground bridge arc overlapping the identical gold circle -->
  <path
    d="M 301.44 389.77 A 94 94 0 0 1 225.00 340.13"
    stroke="url(#goldRing)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- Faceted Wedding Diamond crowning the interlocking rings -->
  <polygon points="222,100 290,100 316,130 256,186 196,130" fill="url(#diamondTop)" />
  <polygon points="256,130 316,130 256,186" fill="url(#diamondSide)" />
  <polygon points="222,100 290,100 276,130 236,130" fill="#FFFFFF" />
  <polygon points="236,130 276,130 256,186" fill="#E0F2FE" fill-opacity="0.7" />
  <path
    d="M 196 130 H 316 M 222 100 L 236 130 L 256 186 L 276 130 L 290 100"
    stroke="#0759BC"
    stroke-opacity="0.22"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Delicate 4-point wedding sparkles -->
  <path
    d="M 140 122 L 146 138 L 162 144 L 146 150 L 140 166 L 134 150 L 118 144 L 134 138 Z"
    fill="#FEF08A"
    fill-opacity="0.92"
  />
  <path
    d="M 372 122 L 378 138 L 394 144 L 378 150 L 372 166 L 366 150 L 350 144 L 366 138 Z"
    fill="#FFFFFF"
    fill-opacity="0.88"
  />
</svg>
